services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arogya
      POSTGRES_USER: arogya
      POSTGRES_PASSWORD: arogya_dev
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arogya -d arogya"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: ./apps/api
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://arogya:arogya_dev@postgres:5432/arogya
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_started
